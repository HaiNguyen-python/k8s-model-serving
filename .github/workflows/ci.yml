name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit, contract, manifest and simulation tests
        run: pytest --cov-fail-under=80
      - name: Render Kustomize overlays (kubectl ships with the runner)
        run: |
          for dir in k8s/shared k8s/overlays/stable k8s/overlays/canary; do
            kubectl kustomize "$dir" > /dev/null
          done

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the model server image
        run: docker build -t canary-serving:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name model -p 8000:8000 -e MODEL_VERSION=v2-good canary-serving:ci
          for i in $(seq 1 30); do
            curl -fs localhost:8000/readyz && break
            sleep 1
          done
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"age_at_enrollment": 19, "scholarship_holder": 0, "debtor": 0,
                 "tuition_up_to_date": 1, "sem1_enrolled": 6, "sem1_approved": 5,
                 "sem1_grade": 13.2}'
          curl -fs localhost:8000/metrics | grep canary_requests_total
          docker image ls canary-serving:ci
      - name: Container logs
        if: always()
        run: docker logs model || true

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: canary
          wait: 120s
      - name: Canary rollout on kind (promote v2-good, roll back v2-bad)
        env:
          CLUSTER_NAME: canary
        run: bash scripts/e2e.sh
