# Test-only: steady synthetic traffic through the Service, so the controller has data to judge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: canary-demo
  labels:
    app: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: canary-serving:local
          imagePullPolicy: IfNotPresent
          command: ["canary", "traffic", "--url", "http://dropout-model.canary-demo.svc", "--rate", "40"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
